
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veylora AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#fff;font-family:Arial,sans-serif}
header{text-align:center;padding:25px 12px;border-bottom:1px solid #28334e}
h1{color:#72f1d5;margin:0;font-size:30px}
header p{color:#aab6d3}
main{max-width:650px;margin:auto;padding:16px}
.panel{background:#151e33;border:1px solid #2b3958;border-radius:16px;padding:16px;margin-bottom:16px}
label{display:block;margin:10px 0}
select,input,button{font:inherit;padding:12px;border-radius:10px}
select,input{background:#0b1020;color:white;border:1px solid #435170;width:100%}
button{border:0;background:#72f1d5;color:#07151b;font-weight:bold;cursor:pointer}
.secondary{background:#33415f;color:white}
#messages{height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.message{padding:12px;background:#25314c;border-radius:12px;overflow-wrap:anywhere;white-space:pre-wrap}
.user{background:#145b60}
.controls{display:flex;gap:8px;margin-top:12px}
.controls input{flex:1;min-width:0}
.status{color:#aab6d3;font-size:14px}
footer{text-align:center;padding:18px;color:#aab6d3}
</style>
</head>
<body>
<header>
<h1>✦ Veylora AI</h1>
<p>Your personal AI companion</p>
</header>
<main>
<section class="panel">
<label for="language">Choose your language</label>
<select id="language">
<option value="en-US">English</option>
<option value="ur-PK">Urdu</option>
<option value="ps-AF">Pashto</option>
</select>
</section>
<section class="panel">
<div id="messages" aria-live="polite">
<div class="message">Veylora: Hello! Welcome to your AI assistant.</div>
</div>
<div class="controls">
<input id="prompt" placeholder="Type your message..." autocomplete="off">
<button id="send">Send</button>
</div>
<div class="controls">
<button id="mic" class="secondary">🎙️ Speak</button>
<button id="clear" class="secondary">Clear</button>
</div>
<p id="status" class="status">Ready</p>
</section>
</main>
<footer>Veylora AI · Your assistant, your journey</footer>
<script>
const input=document.getElementById("prompt");
const messages=document.getElementById("messages");
const language=document.getElementById("language");
const status=document.getElementById("status");

function addMessage(text,who){
 const d=document.createElement("div");
 d.className="message "+who;
 d.textContent=(who==="user"?"You: ":"Veylora: ")+text;
 messages.appendChild(d);
 messages.scrollTop=messages.scrollHeight;
}

function sendMessage(){
 const text=input.value.trim();
 if(!text)return;
 addMessage(text,"user");
 input.value="";
 let answer;
 if(language.value==="ur-PK"){
  answer="آپ کا پیغام موصول ہوا۔ حقیقی AI جواب کے لیے AI کنکشن درکار ہے۔";
 }else if(language.value==="ps-AF"){
  answer="ستاسو پیغام ترلاسه شو. د اصلي AI ځوابونو لپاره د AI اتصال ته اړتیا ده.";
 }else{
  answer="I received your message! I am currently in demo mode. A secure AI connection is needed for intelligent answers.";
 }
 addMessage(answer,"assistant");
 status.textContent="Demo mode";
}

document.getElementById("send").addEventListener("click",sendMessage);
input.addEventListener("keydown",function(e){
 if(e.key==="Enter")sendMessage();
});

document.getElementById("clear").addEventListener("click",function(){
 messages.replaceChildren();
 status.textContent="Chat cleared";
});

document.getElementById("mic").addEventListener("click",function(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){
  status.textContent="Voice input unavailable. Try Chrome.";
  return;
 }
 const recognition=new SR();
 recognition.lang=language.value;
 recognition.onstart=()=>status.textContent="Listening...";
 recognition.onresult=function(e){
  input.value=e.results[0][0].transcript;
  status.textContent="Voice captured. Press Send.";
 };
 recognition.onerror=()=>status.textContent="Microphone error. Check permissions.";
 recognition.start();
});
</script>
</body>
</html>
